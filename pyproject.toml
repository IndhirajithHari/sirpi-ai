[project]
name = "sirpi"
version = "0.1.0"
description = "Sirpi: a local CPU CAD agent for FreeCAD, derived from Taiga-S1"
requires-python = ">=3.11"
dependencies = ["torch>=2.3", "numpy", "safetensors", "huggingface_hub"]

[project.scripts]
sirpi = "sirpi.cli:main"

[project.optional-dependencies]
dev = ["pytest"]
ax = [  # scripts/mesa_ax.py (accessibility, posted keys; --hands also: window capture, OCR, real mouse)
    "pyobjc-framework-ApplicationServices; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz; sys_platform == 'darwin'",
    "pyobjc-framework-Vision; sys_platform == 'darwin'",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["freecad_s1*", "sirpi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
